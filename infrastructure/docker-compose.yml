services:
  postgres:
    image: postgres:16-alpine
    container_name: genlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mkr_db
      POSTGRES_USER: mkr_user
      POSTGRES_PASSWORD: mkr_password
    ports:
      - "5435:5432"
    volumes:
      - mkr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mkr_data:
  redis_data:
