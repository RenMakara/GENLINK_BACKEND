services:
  postgres:
    image: postgres:16-alpine
    container_name: campuslink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslink_db}
      POSTGRES_USER: ${POSTGRES_USER:-campuslink_usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslink@168}
    ports:
      - "16801:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campuslink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
#  redis_data:
