name: Telegram Push Notification

on:
  push:
    branches:
      - '**'   # Triggers on push to ANY branch
      - 'main'
jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Notification
        run: |
          # Build multi-line message using a heredoc to avoid quoting issues
          MESSAGE="$(cat <<'MSG'
          🚀 <b>New Push to Repository!</b>

          📁 <b>Repo:</b> ${{ github.repository }}
          🌿 <b>Branch:</b> ${{ github.ref_name }}
          👤 <b>Pushed by:</b> ${{ github.actor }}
          📝 <b>Commit:</b> ${{ github.event.head_commit.message }}
          🔗 <a href=\"${{ github.event.head_commit.url }}\">View Commit</a>
          MSG
          )"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
          --data-urlencode text="$MESSAGE" \
          -d parse_mode="HTML"
