spring:
  datasource:
    # Allow PostgreSQL's MONTH and YEAR names in H2 tests.
    url: jdbc:h2:mem:campuslink;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  flyway:
    enabled: false
  mail:
    username: test@campuslink.local
    password: test-password

app:
  crypto:
    # Fixed key keeps ciphertext assertions deterministic.
    secret-key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1leGFjdGx5ISE=
  jwt:
    issuer: campuslink-kh-test
    secret: test-secret-test-secret-test-secret-test
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  google:
    client-id: test-google-client-id

  mail:
    # Keep an explicit sender in tests so message construction is deterministic.
    from: test-sender@genlink.local
    # Log-only mode avoids SMTP timeouts in tests.
    enabled: false

  # Tests use in-memory storage; no S3 credentials or network access are needed.
