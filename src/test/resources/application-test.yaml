spring:
  datasource:
    # Finance schema uses month/year column names that PostgreSQL accepts. Tell H2
    # not to treat them as keywords so integration tests can create the same model.
    url: jdbc:h2:mem:campuslink;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  flyway:
    enabled: false
  mail:
    username: test@campuslink.local
    password: test-password

app:
  crypto:
    # Fixed so tests are deterministic. Under a test profile FieldEncryptor would otherwise
    # generate an ephemeral key, which is fine for a local run but makes any assertion about
    # a stored ciphertext depend on JVM startup. Not a secret and not used anywhere real.
    secret-key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1leGFjdGx5ISE=
  jwt:
    issuer: campuslink-kh-test
    secret: test-secret-test-secret-test-secret-test
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  google:
    client-id: test-google-client-id

  mail:
    # REQUIRED for the context to start. EmailServiceImpl injects
    # @Value("${app.mail.from}") and application.yaml declares it as a bare
    # ${MAIL_FROM} with no default, so without a value here every @SpringBootTest
    # fails with "Could not resolve placeholder 'MAIL_FROM'".
    #
    # The comment in application.yaml describes a fallback to MAIL_USERNAME, but
    # that fallback lives in docker-compose, not in the application.
    #
    # Deliberately not fixed by adding a default in application.yaml: a default
    # sender would let production boot misconfigured and fail at the first email
    # instead of at startup.
    from: test-sender@genlink.local
    # Log-only. No SMTP server exists in tests, and a real send attempt would
    # block on connect timeouts.
    enabled: false

  # The test profile uses InMemoryStorageService from src/test. StorageConfig still
  # binds provider-neutral limits and expiry settings, but its AWS client beans and
  # S3StorageService are excluded by @Profile("!test"). Tests therefore need no S3
  # credentials and cannot contact external object storage accidentally.
