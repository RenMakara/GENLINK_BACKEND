spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:16801/campuslink_db}
    username: ${DB_USERNAME:campuslink_usr}
    password: ${DB_PASSWORD:campuslink@168}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  liquibase:
    enabled: true
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  # Development defaults to log-only email: the OTP is written to the console
  # (EmailServiceImpl logs "EMAIL OTP FOR ...") and no SMTP connection is made.
  # To exercise real delivery in dev, set MAIL_ENABLED=true and provide a working
  # SMTP host/username/password plus a verified MAIL_FROM sender.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@campuslinkkh.edu.kh}
  jwt:
    # Default restored so dev boots without the env var; set JWT_ISSUER to override.
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET}
  # client-id lives under app.google, not app.jwt - GoogleTokenVerifier reads
  # app.google.client-id, and a value nested under jwt is read by nothing.
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}

logging:
  level:
    root: info
    kh.edu.acleda.campuslink: debug
    # SQL logging is OFF by default so the console stays readable. To see queries
    # (and their bind parameters) for debugging: SQL_LOG_LEVEL=debug
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    org.hibernate.orm.jdbc.bind: ${SQL_LOG_LEVEL:warn}
    org.liquibase: info
  pattern:
    # This profile replaces the console pattern wholesale, so the `logging.pattern.level`
    # correlation id set in application.yaml does not reach it - it has to be spelled out
    # here too. Rendered faint so it recedes; empty outside a request (jobs, startup).
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{requestId:-}]){faint} %clr(%-26.26logger{0}){cyan} %clr(:){faint} %msg%n%wEx"
