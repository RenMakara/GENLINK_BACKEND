spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/mkr_db}
    username: ${DB_USERNAME:mkr_user}
    password: ${DB_PASSWORD:mkr_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  liquibase:
    enabled: true
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  # Dev logs OTPs instead of sending mail; set MAIL_ENABLED=true for SMTP.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@campuslinkkh.edu.kh}}
  jwt:
    # Default restored so dev boots without the env var; set JWT_ISSUER to override.
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET:}
  # client-id lives under app.google, not app.jwt.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}

logging:
  level:
    root: info
    kh.edu.acleda.campuslink: debug
    # SQL logging is OFF by default so the console stays readable. To see queries
    # (and their bind parameters) for debugging: SQL_LOG_LEVEL=debug
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    org.hibernate.orm.jdbc.bind: ${SQL_LOG_LEVEL:warn}
    org.liquibase: info
  pattern:
    # This profile replaces the console pattern wholesale.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{requestId:-}]){faint} %clr(%-26.26logger{0}){cyan} %clr(:){faint} %msg%n%wEx"
