spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:16801/campuslink_db}
    username: ${DB_USERNAME:campuslink_usr}
    password: ${DB_PASSWORD:campuslink@168}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  liquibase:
    enabled: true
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  jwt:
    issuer: ${JWT_ISSUER}
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh-dev}

logging:
  level:
    root: info
    kh.edu.acleda.campuslink: debug
#    org.hibernate.SQL: debug
    org.liquibase: info
