spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  liquibase:
    enabled: true
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  mail:
    # Real SMTP delivery is enabled in production unless explicitly disabled.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME}}
  jwt:
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    project-id: ${GOOGLE_PROJECT_ID:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: info
    # App logs stay at INFO; framework chatter is capped to WARN so production
    # logs read as "what our app did", not Spring/Tomcat/Hibernate internals.
    # root stays INFO so startup ("Started ... in Ns", "Tomcat started on 8888")
    # and health remain visible.
    kh.edu.acleda.campuslink: info
    org.hibernate: warn
    org.hibernate.SQL: warn
    org.springframework.web: warn
    org.apache.catalina: warn
    org.apache.coyote: warn
    org.apache.tomcat: warn
    org.liquibase: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %-26.26logger{0} : %msg%n%wEx"
