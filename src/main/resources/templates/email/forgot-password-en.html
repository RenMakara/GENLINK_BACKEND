<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLink KH Password Reset Code</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb;">
          <tr>
            <td style="background:#2563eb;padding:28px 32px;color:#ffffff;">
              <div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.9;">CampusLink KH</div>
              <h1 style="margin:8px 0 0;font-size:24px;line-height:32px;font-weight:700;">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Use this code to reset your CampusLink KH password.</p>
              <div style="margin:28px 0;padding:22px 24px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;text-align:center;">
                <div style="font-size:13px;color:#2563eb;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Reset code</div>
                <div style="font-size:36px;line-height:44px;font-weight:700;letter-spacing:8px;color:#1e3a8a;">{{otp}}</div>
              </div>
              <p style="margin:0 0 10px;font-size:14px;line-height:22px;color:#4b5563;">This code expires in 10 minutes.</p>
              <p style="margin:0;font-size:14px;line-height:22px;color:#4b5563;">If you did not request a password reset, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
