spring:
  application:
    name: GENLINK-KH
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Without these, JavaMail inherits the OS default and a
          # unreachable SMTP host blocks the calling thread for ~2 minutes.
          # Because OTP delivery runs inside the HTTP request, that stalls
          # registration far past the mobile client's 15s timeout: the
          # account is created but the app reports failure. 5s fails fast
          # instead; the OTP is still logged and stored either way.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false

server:
  port: 8888

app:
  mail:
    # The "From" address on outgoing mail.
    #
    # Kept separate from spring.mail.username because with a transactional
    # provider (Brevo, SendGrid, Mailgun) the SMTP *login* is a generated
    # credential like 8a1b2c001@smtp-brevo.com — not a mailbox you own. The
    # provider rejects mail whose From is not a verified sender, so this
    # must be the address you verified with them.
    #
    # Falls back to MAIL_USERNAME, which is correct for Gmail where the
    # login and the sender address are the same thing.
    from: ${MAIL_FROM}
  admin:
    # ONE-OFF. Promotes an existing, email-verified user to SUPER_ADMIN on startup
    # (SSOT 13.3). Blank in every environment except the moment you use it.
    #
    # Procedure: set it -> start -> confirm "ADMIN BOOTSTRAP: <email> promoted to
    # SUPER_ADMIN" at WARN -> sign in and complete TOTP enrolment -> REMOVE IT.
    #
    # It is a no-op while any active SUPER_ADMIN exists, so leaving it set is not
    # an open door today. It is still a loaded gun pointed at the day someone
    # deactivates the last SUPER_ADMIN, so remove it.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}

  community:
    # Event reminders run five minutes and look for events roughly 24 hours away.
    # Set empty scheduling globally with app.scheduling.enabled=false when needed.
    event-reminder-cron: ${EVENT_REMINDER_CRON:0 */5 * * * *}

  cors:
    # Origins allowed to call /api/v1/admin/** from a browser (SSOT 10.9).
    # Comma-separated full origins: https://admin.genlink.kh,http://localhost:3000
    #
    # EMPTY BY DEFAULT, and that is correct for the MVP: the portal and the API
    # share one nginx origin under path-based routing, so admin requests are
    # same-origin and CORS never applies. This exists for the eventual subdomain
    # split. Empty means every cross-origin admin request is refused.
    #
    # No wildcard, in any environment.
    admin-origins: ${ADMIN_CORS_ORIGINS:}

  crypto:
    # Encrypts credential columns at rest - today admin_users.totp_secret (SSOT §9.2).
    #
    # Base64, exactly 32 bytes: `openssl rand -base64 32`. Defaulted to empty rather than
    # left unset so a missing value fails inside FieldEncryptor with an actionable message,
    # instead of as a placeholder-resolution error before the app has a chance to explain.
    #
    # LOSING THIS IS NOT RECOVERABLE: every enrolled admin has to set up TOTP again. Back it
    # up alongside JWT_SECRET.
    secret-key: ${ADMIN_CRYPTO_KEY:}

  jwt:
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET:}
    # 15 minutes. Access tokens are stateless, so this bounds the window in which a
    # stolen token stays usable; the token-version claim handles explicit revocation.
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    # 10 minutes for the admin portal. Shorter than the mobile token on purpose: a stolen
    # mobile token reaches one person's data, a stolen admin token reaches everyone's.
    admin-access-token-expiration-ms: ${JWT_ADMIN_ACCESS_EXPIRATION_MS:600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}
  localization:
    default-language: ${APP_DEFAULT_LANGUAGE:ENGLISH}
  media:
    cleanup:
      # Daily sweep that reclaims storage: rows presigned but never confirmed, and
      # objects whose soft delete has aged out. 03:45 sits fifteen minutes after
      # the account sweep so a departed user's media is already soft-deleted by
      # the time this runs.
      cron: ${MEDIA_CLEANUP_CRON:0 45 3 * * *}
      # How long a PENDING row may sit before it counts as abandoned. Keep well
      # above app.storage.presign-expiry-seconds so a slow upload is never reaped
      # while the client is still working.
      orphan-age: ${MEDIA_ORPHAN_AGE:24h}
      # How long a soft-deleted object stays recoverable before its bytes go.
      # Matches the account-deletion window.
      retention: ${MEDIA_RETENTION:30d}
      # Rows per sweep per run — bounds memory and transaction size. A backlog
      # larger than this continues on the next run (logged as "+more").
      batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:500}
  storage:
    # S3-compatible object storage. Provider is decided entirely by these env
    # vars — the code speaks plain S3, so changing provider only changes
    # these values.
    endpoint: ${STORAGE_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${STORAGE_REGION:sgp1}
    bucket: ${STORAGE_BUCKET:}
    # CDN base used to build public URLs, e.g.
    # https://<cdn-host>/genlink-media-dev/...
    cdn-base: ${STORAGE_CDN_BASE:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    # How long a presigned upload/download URL stays valid.
    presign-expiry-seconds: ${STORAGE_PRESIGN_EXPIRY:300}
    # Per-purpose size ceilings, enforced server-side regardless of any
    # client-side compression.
    max-image-mb: ${MEDIA_MAX_IMAGE_MB:5}
    max-video-mb: ${MEDIA_MAX_VIDEO_MB:50}
    # Off by default for compatibility: some S3-compatible providers have
    # partial support for the x-amz-checksum-sha256 header, and pinning it in
    # the presigned PUT would break uploads where unsupported. The checksum is
    # still stored for integrity
    # and dedup. Turn on only against a provider that supports flexible checksums.
    enforce-checksum: ${STORAGE_ENFORCE_CHECKSUM:false}
    # false = virtual-hosted style (Spaces/S3/R2); true = path-style (MinIO).
    path-style-access: ${STORAGE_PATH_STYLE:false}
    # Legacy Spaces deployments may need object ACLs. AWS S3 with a private
    # bucket and CloudFront OAC must keep this false because ACLs are disabled.
    public-read-acl: ${STORAGE_PUBLIC_READ_ACL:true}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.liquibase: info
  pattern:
    # Appends the correlation id (RequestIdFilter) to every log line, so a line can be tied
    # to a request and to its admin_audit_logs row. Overriding `level` rather than `console`
    # is deliberate: Spring Boot's default console AND file patterns both interpolate this,
    # so one setting covers both without restating the whole pattern.
    # Empty outside a request - scheduled jobs and async work have nothing to correlate to.
    level: "%5p [%X{requestId:-}]"
