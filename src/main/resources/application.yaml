spring:
  application:
    name: GENLINK-KH
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Without these, JavaMail inherits the OS default and a
          # unreachable SMTP host blocks the calling thread for ~2 minutes.
          # Because OTP delivery runs inside the HTTP request, that stalls
          # registration far past the mobile client's 15s timeout: the
          # account is created but the app reports failure. 5s fails fast
          # instead; the OTP is still logged and stored either way.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false

server:
  port: 8888

app:
  mail:
    # The "From" address on outgoing mail.
    #
    # Kept separate from spring.mail.username because with a transactional
    # provider (Brevo, SendGrid, Mailgun) the SMTP *login* is a generated
    # credential like 8a1b2c001@smtp-brevo.com — not a mailbox you own. The
    # provider rejects mail whose From is not a verified sender, so this
    # must be the address you verified with them.
    #
    # Falls back to MAIL_USERNAME, which is correct for Gmail where the
    # login and the sender address are the same thing.
    from: ${MAIL_FROM}
  jwt:
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET}
    # 15 minutes. Access tokens are stateless, so this bounds the window in which a
    # stolen token stays usable; the token-version claim handles explicit revocation.
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}
  localization:
    default-language: ${APP_DEFAULT_LANGUAGE:ENGLISH}
  media:
    # Daily sweep that reclaims storage: rows presigned but never confirmed, and
    # objects whose soft delete has aged out. 03:45 sits fifteen minutes after the
    # account sweep so a departed user's media is already soft-deleted by then.
    cleanup-cron: ${MEDIA_CLEANUP_CRON:0 45 3 * * *}
    # How long a soft-deleted object stays recoverable before its bytes are
    # removed. Matches the account-deletion window.
    soft-delete-grace-days: ${MEDIA_SOFT_DELETE_GRACE_DAYS:30}
  storage:
    # S3-compatible object storage. Provider is decided entirely by these env
    # vars — DigitalOcean Spaces in every environment today, but the code speaks
    # plain S3 so R2/S3/MinIO would only change these values.
    endpoint: ${STORAGE_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${STORAGE_REGION:sgp1}
    bucket: ${STORAGE_BUCKET}
    # CDN base used to build public URLs, e.g.
    # https://genlink-media-dev.sgp1.cdn.digitaloceanspaces.com
    cdn-base: ${STORAGE_CDN_BASE}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    # How long a presigned upload/download URL stays valid.
    presign-expiry-seconds: ${STORAGE_PRESIGN_EXPIRY:300}
    # Per-purpose size ceilings, enforced server-side regardless of any
    # client-side compression.
    max-image-mb: ${MEDIA_MAX_IMAGE_MB:5}
    max-video-mb: ${MEDIA_MAX_VIDEO_MB:50}
    # Off by default: DigitalOcean Spaces has partial support for the
    # x-amz-checksum-sha256 header, and pinning it in the presigned PUT would
    # break uploads where unsupported. The checksum is still stored for integrity
    # and dedup. Turn on only against a provider that supports flexible checksums.
    enforce-checksum: ${STORAGE_ENFORCE_CHECKSUM:false}
    # false = virtual-hosted style (Spaces/S3/R2); true = path-style (MinIO).
    path-style-access: ${STORAGE_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.liquibase: info
