spring:
  application:
    name: GENLINK-KH
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  health:
    mail:
      enabled: false

server:
  port: 8888

app:
  jwt:
    issuer: ${JWT_ISSUER:genlink-kh}
    secret: ${JWT_SECRET}
    # 15 minutes. Access tokens are stateless, so this bounds the window in which a
    # stolen token stays usable; the token-version claim handles explicit revocation.
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}
  localization:
    default-language: ${APP_DEFAULT_LANGUAGE:ENGLISH}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.liquibase: info
