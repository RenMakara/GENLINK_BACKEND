spring:
  application:
    name: GENLINK-KH
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Without these, JavaMail inherits the OS default.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false

server:
  port: 8888

app:
  mail:
    # The "From" address on outgoing mail.
    from: ${MAIL_FROM:${MAIL_USERNAME}}
  admin:
    # Use once to promote an existing verified user to SUPER_ADMIN.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    suspension-expiry-cron: ${ADMIN_SUSPENSION_EXPIRY_CRON:0 0 3 * * *}

  community:
    # Event reminders run five minutes and look for events roughly 24 hours away.
    event-reminder-cron: ${EVENT_REMINDER_CRON:0 */5 * * * *}

  notification:
    email:
      # Separate from app.mail.enabled: this switch never changes OTP behaviour.
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    push:
      # Online STOMP push is safe to expose behind the authenticated WebSocket endpoint.
      enabled: ${NOTIFICATION_PUSH_ENABLED:true}
    mobile-push:
      # Disabled until Firebase credentials and the mobile client token flow are configured.
      enabled: ${NOTIFICATION_MOBILE_PUSH_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:}
      # Optional one-line Base64 service-account JSON for a secret manager.
      credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    outbox:
      # Polling is enabled only on instances that run the shared scheduler.
      poll-ms: ${NOTIFICATION_OUTBOX_POLL_MS:5000}
      initial-delay-ms: ${NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:5000}
      batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:5}

  productivity:
    # Task reminders scan configured reminder_time values every five minutes.
    task-reminder-cron: ${TASK_REMINDER_CRON:0 */5 * * * *}

  cors:
    # Origins allowed to call /api/v1/admin/** from a browser (SSOT 10.9).
    admin-origins: ${ADMIN_CORS_ORIGINS:}

  crypto:
    # Encrypts credential columns at rest - today admin_users.totp_secret (SSOT §9.2).
    secret-key: ${ADMIN_CRYPTO_KEY:}

  jwt:
    issuer: ${JWT_ISSUER:genlink_kh}
    secret: ${JWT_SECRET:}
    # 15 minutes.
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    # 10 minutes for the admin portal.
    admin-access-token-expiration-ms: ${JWT_ADMIN_ACCESS_EXPIRATION_MS:600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    project-id: ${GOOGLE_PROJECT_ID:genlinkkh}
  localization:
    default-language: ${APP_DEFAULT_LANGUAGE:ENGLISH}
  media:
    cleanup:
      # Reclaims expired uploads and soft-deleted media each day.
      cron: ${MEDIA_CLEANUP_CRON:0 45 3 * * *}
      # How long a PENDING row may sit before it counts as abandoned.
      orphan-age: ${MEDIA_ORPHAN_AGE:24h}
      # How long a soft-deleted object stays recoverable before its bytes go.
      # Matches the account-deletion window.
      retention: ${MEDIA_RETENTION:30d}
      # Rows per sweep per run — bounds memory and transaction size. A backlog
      # larger than this continues on the next run (logged as "+more").
      batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:500}
  storage:
    # S3-compatible object storage.
    endpoint: ${STORAGE_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${STORAGE_REGION:sgp1}
    bucket: ${STORAGE_BUCKET:}
    # CDN base used to build public URLs, e.g.
    # https://<cdn-host>/genlink-media-dev/...
    cdn-base: ${STORAGE_CDN_BASE:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    # How long a presigned upload/download URL stays valid.
    presign-expiry-seconds: ${STORAGE_PRESIGN_EXPIRY:300}
    # Per-purpose size ceilings, enforced server-side regardless of any
    # client-side compression.
    max-image-mb: ${MEDIA_MAX_IMAGE_MB:5}
    max-video-mb: ${MEDIA_MAX_VIDEO_MB:50}
    # Keep optional for providers without x-amz-checksum-sha256 support.
    enforce-checksum: ${STORAGE_ENFORCE_CHECKSUM:false}
    # false = virtual-hosted style (Spaces/S3/R2); true = path-style (MinIO).
    path-style-access: ${STORAGE_PATH_STYLE:false}
    # Legacy Spaces deployments may need object ACLs.
    public-read-acl: ${STORAGE_PUBLIC_READ_ACL:true}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.liquibase: info
  pattern:
    # Appends the correlation id (RequestIdFilter) to every log line.
    level: "%5p [%X{requestId:-}]"
