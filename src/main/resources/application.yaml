spring:
  application:
    name: campuslink-kh
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  health:
    mail:
      enabled: false

server:
  port: 8888

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:campuslink-kh}
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.liquibase: debug
