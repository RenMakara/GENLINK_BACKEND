# GenLink KH Nginx reverse proxy.

# App listens on loopback port 8888.
upstream genlink_app {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Point this hostname to the EC2 Elastic IP.
    server_name api.genlink.enat.online;

    # Allow larger JSON bodies for profiles and future uploads.
    client_max_body_size 10M;

    # System logrotate handles these Nginx logs.
    access_log /var/log/nginx/genlink.access.log;
    error_log  /var/log/nginx/genlink.error.log;

    location / {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;

        # Forward the public host and client details to Spring.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # The direct client IP prevents spoofing; update this for trusted proxies.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Clear Connection so the upstream keepalive is used.
        proxy_set_header Connection "";

        # Allow outbound mail and Google verification to finish.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    location /ws {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Disable buffering for WebSockets.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
