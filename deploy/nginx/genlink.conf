# GenLink KH — Nginx reverse proxy (HTTP, IP-based for now).
#
# Nginx is the single public entry point. It accepts the client connection
# on port 80 and forwards to the Spring Boot app, which listens ONLY on
# 127.0.0.1:8888 and is never directly reachable from the internet. That
# separation is what makes the later switch to a domain + HTTPS a config
# change here, with no change to the application.
#
# ─────────────────────────────────────────────────────────────────────────
# MIGRATION TO https://api.genlinkkh.com (later — no app rebuild):
#   1. Create a DNS A record: api.genlinkkh.com -> this EC2 instance's Elastic IP.
#   2. Change `server_name` below to:  api.genlinkkh.com;
#   3. Run:  sudo certbot --nginx -d api.genlinkkh.com
#      Certbot rewrites THIS file: it adds a `listen 443 ssl` server block,
#      the certificate paths, and an automatic 80 -> 443 redirect. The
#      proxy_pass and headers below are reused unchanged.
# ─────────────────────────────────────────────────────────────────────────

# The app's loopback-bound port, named once so the server block reads
# cleanly. `keepalive` reuses upstream connections instead of a new TCP
# handshake on every request.
upstream genlink_app {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # For now, the EC2 instance's Elastic IP. Replace with your real IP if it
    # differs, then change to `api.genlinkkh.com;` at migration. Using the
    # IP (rather than `_`) means certbot has a concrete name to attach to
    # later.
    server_name 18.143.33.191;

    # Avatar values are URLs (strings), but allow a reasonable body so a
    # large JSON payload or a future upload is not rejected with 413.
    client_max_body_size 10M;

    # App-specific logs. Ubuntu's stock logrotate already rotates
    # everything under /var/log/nginx, so these are covered (Step 7).
    access_log /var/log/nginx/genlink.access.log;
    error_log  /var/log/nginx/genlink.error.log;

    location / {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;

        # These headers let Spring Boot reconstruct the REAL public URL.
        # With SERVER_FORWARD_HEADERS_STRATEGY=framework (set in .env),
        # Spring trusts them — so it knows the scheme (https, later) and the
        # host (the domain, later), even though the app itself only ever
        # saw plain http on port 8888. This is the mechanism that keeps the
        # migration code-free: password-reset links, OAuth redirects and
        # Swagger URLs all come out with the right scheme and host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr, NOT $proxy_add_x_forwarded_for. The difference is a
        # security control, not a style choice.
        #
        # $proxy_add_x_forwarded_for APPENDS to the header the client sent, so
        # a request carrying "X-Forwarded-For: 1.2.3.4" arrives at the app as
        # "1.2.3.4, <real ip>". The app reads the FIRST entry, which is the
        # attacker's value — and login rate limiting buckets by client IP, so
        # rotating that header gives a fresh bucket per request and the
        # 5-failures-per-15-minutes lockout (SSOT §10.6) never fires. It also
        # lets anyone write arbitrary addresses into security_audit_logs.
        #
        # There is exactly one hop here (client -> nginx -> app), so there is no
        # legitimate chain to preserve. Overwriting discards whatever the client
        # claimed and leaves nginx's own view of the peer.
        #
        # If a CDN or a second proxy is ever put in front of this, do NOT revert
        # to $proxy_add_x_forwarded_for — configure the real_ip module
        # (set_real_ip_from <trusted range>; real_ip_header X-Forwarded-For;)
        # so nginx resolves the client itself and $remote_addr stays truthful.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required so the keepalive upstream above is actually used.
        proxy_set_header Connection "";

        # OTP email delivery and Google token verification make outbound
        # calls that can take a few seconds. Being explicit avoids a
        # surprise 504 if a mail server is briefly slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    location /ws {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Disable buffering for WebSockets
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
