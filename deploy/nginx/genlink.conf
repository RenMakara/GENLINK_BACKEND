# GenLink KH — Nginx reverse proxy (HTTP, domain-based before TLS).

# The app's loopback-bound port, named once so the server block reads
# cleanly. `keepalive` reuses upstream connections instead of a new TCP
# handshake on every request.
upstream genlink_app {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Public hostname. DNS must point this name to the EC2 Elastic IP.
    server_name api.genlink.enat.online;

    # Avatar values are URLs (strings), but allow a reasonable body so a
    # large JSON payload or a future upload is not rejected with 413.
    client_max_body_size 10M;

    # App-specific logs. Ubuntu's stock logrotate already rotates
    # everything under /var/log/nginx, so these are covered (Step 7).
    access_log /var/log/nginx/genlink.access.log;
    error_log  /var/log/nginx/genlink.error.log;

    location / {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;

        # These headers let Spring Boot reconstruct the REAL public URL.
        # With SERVER_FORWARD_HEADERS_STRATEGY=framework (set in .env),
        # Spring trusts them — so it knows the scheme (https, later) and the
        # host (the domain, later), even though the app itself only ever
        # saw plain http on port 8888. This is the mechanism that keeps the
        # migration code-free: password-reset links, OAuth redirects and
        # Swagger URLs all come out with the right scheme and host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr, NOT $proxy_add_x_forwarded_for. The difference is a
        # security control, not a style choice.

        # If a CDN or a second proxy is ever put in front of this, do NOT revert
        # to $proxy_add_x_forwarded_for — configure the real_ip module
        # (set_real_ip_from <trusted range>; real_ip_header X-Forwarded-For;)
        # so nginx resolves the client itself and $remote_addr stays truthful.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required so the keepalive upstream above is actually used.
        proxy_set_header Connection "";

        # OTP email delivery and Google token verification make outbound
        # calls that can take a few seconds. Being explicit avoids a
        # surprise 504 if a mail server is briefly slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    location /ws {
        proxy_pass http://genlink_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Disable buffering for WebSockets
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
