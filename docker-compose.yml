  # GenLink KH — production stack.
name: genlink

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    # Pinned to a minor-stable tag. Never use `latest` in production: a
    # silent major upgrade can make the data directory unreadable.
    image: postgres:16-alpine
    container_name: genlink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous: first boot has to initialise the cluster.
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Spring Boot ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genlink-api:latest

    # ── LOAD-BEARING. Do not remove without reading this. ────────────────
    # A fixed container_name means Docker refuses to start a second copy of
    # this service: `docker compose up --scale app=2` fails outright instead
    # of silently running two. That is not naming tidiness — four security
    # controls are only correct because exactly one instance exists:
    #
    #   1. Login/password rate limiting (AuthRateLimitService) is an in-memory
    #      ConcurrentHashMap. On two replicas an attacker simply spreads
    #      attempts across them and the limiter stops limiting.
    #   2. Per-IP request throttling on /api/v1/auth/** (RateLimitFilter ->
    #      RateLimitService) holds its bucket4j buckets in another in-memory
    #      ConcurrentHashMap. Same failure, and it is easy to miss because it
    #      is a servlet filter rather than a call in the service layer: two
    #      replicas simply double the effective limit.
    #   3. Admin permission caching (AdminPermissionCache) has no TTL — it
    #      relies on evict-on-write, which only reaches the node that handled
    #      the write. On two replicas a revoked admin permission would stay
    #      live on the other one. That is a security bug, not staleness.
    #   4. MFA challenge state (AdminMfaChallengeStore) is a third in-memory
    #      ConcurrentHashMap. It enforces "5 TOTP attempts per challenge" and
    #      "a challenge is single-use". On two replicas an attacker gets five
    #      guesses PER REPLICA, and a spent challenge stays replayable on the
    #      node that did not see it spent — a second admin session for free.
    #
    # BEFORE REMOVING THIS LINE to scale horizontally, all four must move to
    # Redis. Redis is already declared below behind the `cache` profile, but
    # the app has no spring-boot-starter-data-redis dependency yet, so it
    # cannot talk to it — adding that dependency is the first step.
    #
    # Migrating only some of them is the dangerous outcome: the interlock then
    # looks removable while a per-instance control is still in place.
    #
    # See docs/admin-dashboard.md §14.6.
    # ─────────────────────────────────────────────────────────────────────
    container_name: genlink-api
    restart: unless-stopped

    # Every value comes from .env — nothing secret is written in this file,
    # so docker-compose.yml stays safe to commit.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-genlink_kh}

      ADMIN_CRYPTO_KEY: ${ADMIN_CRYPTO_KEY}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}

      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-genlinkkh}

      NOTIFICATION_MOBILE_PUSH_ENABLED: ${NOTIFICATION_MOBILE_PUSH_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      APP_DEFAULT_LANGUAGE: ${APP_DEFAULT_LANGUAGE:-ENGLISH}

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-https://sgp1.digitaloceanspaces.com}
      STORAGE_REGION: ${STORAGE_REGION:-sgp1}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_CDN_BASE: ${STORAGE_CDN_BASE}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PUBLIC_READ_ACL: ${STORAGE_PUBLIC_READ_ACL:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      TZ: ${TZ:-Asia/Phnom_Penh}

    depends_on:
      postgres:
        # Waits for pg_isready, not just "container started". Liquibase runs
        # at boot and would fail against a database still initialising.
        condition: service_healthy

    ports:
      # Loopback only. Nginx (on the host) proxies to this; the port is
      # never reachable from the internet. Keeping it bound lets you curl
      # the app directly from the EC2 instance while debugging.
      - "127.0.0.1:8888:8888"

    # Caps the JVM. Combined with MaxRAMPercentage=75 in the Dockerfile
    # this gives roughly a 576 MB heap and leaves room for Postgres.
    # Raise it if your EC2 instance is larger than 2 GB.
    mem_limit: 768m

    healthcheck:
      # /actuator/health is permitAll() in SecurityConfig, so this needs no
      # token. `wget --spider` avoids installing curl in the image.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: first boot also runs every Liquibase migration.
      start_period: 90s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (optional, OFF by default) ──────────────────────────────────
  #
  # Started only with:  docker compose --profile cache up -d
  #
  # Leave it off for now. The application has `spring-boot-starter-cache`
  # but NOT `spring-boot-starter-data-redis`, so Spring cannot talk to
  # Redis yet — running it today would consume RAM and serve no traffic.
  # Turn it on in the same commit that adds the dependency.
  redis:
    image: redis:7-alpine
    container_name: genlink-redis
    restart: unless-stopped
    profiles: ["cache"]
    # `--save ""` disables snapshotting: as a pure cache there is nothing
    # worth persisting, and it avoids fork-related memory spikes.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    # Explicitly named so it is easy to find, back up and restore:
    #   docker volume inspect genlink_postgres_data
    name: genlink_postgres_data
