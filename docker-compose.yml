  # GenLink KH — production stack.
name: genlink

services:
  # PostgreSQL
  postgres:
    # Pinned to a minor-stable tag. Never use `latest` in production: a
    # silent major upgrade can make the data directory unreadable.
    image: postgres:16-alpine
    container_name: genlink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous: first boot has to initialise the cluster.
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genlink-api:latest

    # Keep one API instance: rate limits, permission cache, and MFA state are in memory.
    # Move all in-memory controls to Redis before scaling.
    container_name: genlink-api
    restart: unless-stopped

    # Load values from .env; keep secrets out of this file.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-genlink_kh}

      ADMIN_CRYPTO_KEY: ${ADMIN_CRYPTO_KEY}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}

      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-genlinkkh}

      NOTIFICATION_MOBILE_PUSH_ENABLED: ${NOTIFICATION_MOBILE_PUSH_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      APP_DEFAULT_LANGUAGE: ${APP_DEFAULT_LANGUAGE:-ENGLISH}

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-https://sgp1.digitaloceanspaces.com}
      STORAGE_REGION: ${STORAGE_REGION:-sgp1}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_CDN_BASE: ${STORAGE_CDN_BASE}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PUBLIC_READ_ACL: ${STORAGE_PUBLIC_READ_ACL:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      TZ: ${TZ:-Asia/Phnom_Penh}

    depends_on:
      postgres:
        # Wait for PostgreSQL to finish starting before Liquibase runs.
        condition: service_healthy

    ports:
      # Loopback only.
      - "127.0.0.1:8888:8888"

    # Limit container memory to 768 MB.
    mem_limit: 768m

    healthcheck:
      # The health endpoint is public; wget avoids adding curl to the image.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: first boot also runs every Liquibase migration.
      start_period: 90s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Redis cache; start it with --profile cache.
  redis:
    image: redis:7-alpine
    container_name: genlink-redis
    restart: unless-stopped
    profiles: ["cache"]
    # Disable persistence for this cache to avoid disk and fork overhead.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    # Named volume for simple backup and restore.
    name: genlink_postgres_data
